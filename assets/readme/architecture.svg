    <g transform="translate(690, 26)">
      <rect width="310" height="85" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="24" fill="#F472B6" font-family="monospace" font-weight="700" font-size="11">ASYNC STORAGE FALLBACK</text>
