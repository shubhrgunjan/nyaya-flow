      <text x="14" y="46" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Deterministic Gate</text>
      <text x="14" y="64" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Gemini 2.5 Flash / 3.6 Flash</text>
