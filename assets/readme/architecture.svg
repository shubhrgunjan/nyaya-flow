      <text x="14" y="24" fill="#F472B6" font-family="monospace" font-weight="700" font-size="11">LEGAL RETRIEVAL</text>
      <text x="14" y="46" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">India Law Provider</text>
      <text x="14" y="64" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">YouTube Legal Video Provider</text>
      <text x="14" y="84" fill="#64748B" font-family="monospace" font-size="10">Curated Statutory Source Map</text>
