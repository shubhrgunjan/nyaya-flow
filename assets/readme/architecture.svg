      <text x="14" y="44" fill="#94A3B8" font-family="monospace" font-size="11">SPA Router · Responsive Layout</text>
    </g>
    <g transform="translate(260, 26)">
      <rect width="220" height="65" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="24" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multilingual UI Engine</text>
      <text x="14" y="44" fill="#38BDF8" font-family="monospace" font-size="11">hi · mr · en · hinglish · ta · te</text>
    </g>
    <g transform="translate(500, 26)">
      <rect width="240" height="65" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="24" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multimodal Voice/Doc Handler</text>
      <text x="14" y="44" fill="#A7F3D0" font-family="monospace" font-size="11">AudioRecorder · Doc Picker</text>
    </g>
    <g transform="translate(760, 26)">
      <rect width="240" height="65" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="24" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Developer Inspector UI</text>
      <text x="14" y="44" fill="#F472B6" font-family="monospace" font-size="11">Trace Visualizer · Latency</text>
