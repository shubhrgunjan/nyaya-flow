      <text x="14" y="64" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Gnani.ai STT v3 (Optional)</text>
      <text x="14" y="84" fill="#64748B" font-family="monospace" font-size="10">Multipart Form / PCM Buffer</text>
    </g>

    <g transform="translate(520, 26)">
