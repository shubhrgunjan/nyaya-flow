    <rect x="16" y="-12" width="220" height="24" rx="4" fill="#065F46" stroke="#10B981" stroke-width="1" />
    <text x="126" y="4" fill="#A7F3D0" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">DATA &amp; PERSISTENCE LAYER</text>

    <g transform="translate(20, 26)">
