  </defs>

  <!-- Background -->
  <rect width="1100" height="600" fill="url(#arch-bg)" rx="12" />
  <rect width="1100" height="600" fill="none" stroke="#1E293B" stroke-width="2" rx="12" />

  <!-- Title -->
  <text x="40" y="44" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="1">SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>
  <text x="40" y="64" fill="#64748B" font-family="monospace" font-size="12">NYAYA FLOW · SECURE END-TO-END DEPLOYMENT ARCHITECTURE</text>

  <!-- LAYER 1: CLIENT PRESENTATION (React Native / Expo Web) -->
  <g transform="translate(40, 95)">
    <rect width="1020" height="110" rx="10" fill="url(#box-grad)" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="16" y="-12" width="220" height="24" rx="4" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1" />
    <text x="126" y="4" fill="#93C5FD" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">CLIENT PRESENTATION LAYER</text>

    <!-- Subcomponents -->
    <g transform="translate(20, 26)">
      <rect width="220" height="65" rx="6" fill="#0F172A" stroke="#1E293B" />
