<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="multi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12" />
      <stop offset="100%" stop-color="#161B26" />
    </linearGradient>
    <linearGradient id="core-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <rect width="1000" height="450" fill="url(#multi-bg)" rx="12" />
  <rect width="1000" height="450" fill="none" stroke="#1E293B" stroke-width="2" rx="12" />

  <text x="40" y="44" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">MULTILINGUAL CASE STATE ARCHITECTURE</text>
  <text x="40" y="64" fill="#64748B" font-family="monospace" font-size="11">LANGUAGE IS PRESENTATION-LEVEL STATE · UNDERLYING CASE REMAINS IDENTICAL</text>

  <!-- Core Case State Center -->
  <g transform="translate(320, 100)">
    <rect width="360" height="110" rx="10" fill="url(#core-card)" stroke="#6366F1" stroke-width="2" />
    <text x="180" y="28" fill="#C7D2FE" font-family="monospace" font-weight="800" font-size="12" text-anchor="middle">STRUCTURED CASE STATE (LANGUAGE-NEUTRAL)</text>

    <g transform="translate(20, 42)">
      <rect width="320" height="52" rx="6" fill="#0F172A" stroke="#3730A3" />
      <text x="12" y="20" fill="#94A3B8" font-family="monospace" font-size="11">Facts: <tspan fill="#F8FAFC">Security Deposit ₹75,000</tspan></text>
      <text x="12" y="38" fill="#94A3B8" font-family="monospace" font-size="11">Jurisdiction: <tspan fill="#38BDF8">Rent Control Act §108</tspan></text>
    </g>
  </g>

  <!-- Fan Out Lines -->
  <path d="M 380 210 L 160 270" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 2" />
  <path d="M 440 210 L 370 270" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2" />
  <path d="M 500 210 L 500 270" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 2" />
  <path d="M 560 210 L 630 270" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 2" />
  <path d="M 620 210 L 840 270" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Renderers -->
  <!-- Hindi -->
  <g transform="translate(40, 270)">
    <rect width="210" height="140" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#EF4444" fill-opacity="0.2" />
    <text x="42" y="26" fill="#FCA5A5" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">हिन्दी (hi)</text>

    <text x="12" y="52" fill="#F8FAFC" font-family="sans-serif" font-weight="600" font-size="12">सुरक्षा जमा राशि विवाद</text>
    <text x="12" y="74" fill="#94A3B8" font-family="sans-serif" font-size="11">1. लीज समझौते की समीक्षा करें</text>
    <text x="12" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">2. मकान मालिक को औपचारिक नोटिस</text>
    <text x="12" y="120" fill="#38BDF8" font-family="monospace" font-size="10">Rent Control Act §108</text>
  </g>

  <!-- Marathi -->
  <g transform="translate(265, 270)">
    <rect width="210" height="140" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2" />
    <text x="44" y="26" fill="#FDE68A" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">मराठी (mr)</text>

    <text x="12" y="52" fill="#F8FAFC" font-family="sans-serif" font-weight="600" font-size="12">सुरक्षा ठेव परत मिळवणे</text>
    <text x="12" y="74" fill="#94A3B8" font-family="sans-serif" font-size="11">1. कराराची तपासणी करा</text>
    <text x="12" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">2. घरमालकाला लेखी नोटीस</text>
    <text x="12" y="120" fill="#38BDF8" font-family="monospace" font-size="10">Rent Control Act §108</text>
  </g>

  <!-- English -->
  <g transform="translate(490, 270)">
    <rect width="200" height="140" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <rect x="12" y="12" width="75" height="20" rx="4" fill="#10B981" fill-opacity="0.2" />
    <text x="49" y="26" fill="#A7F3D0" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">English (en)</text>

    <text x="12" y="52" fill="#F8FAFC" font-family="sans-serif" font-weight="600" font-size="12">Security Deposit Dispute</text>
    <text x="12" y="74" fill="#94A3B8" font-family="sans-serif" font-size="11">1. Review Rental Agreement</text>
    <text x="12" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">2. Issue Formal Demand Notice</text>
    <text x="12" y="120" fill="#38BDF8" font-family="monospace" font-size="10">Rent Control Act §108</text>
  </g>

  <!-- Regional (Ta/Te/Bn) -->
  <g transform="translate(705, 270)">
    <rect width="255" height="140" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
    <rect x="12" y="12" width="130" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="77" y="26" fill="#DDD6FE" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Bengali / Tamil / Telugu</text>

    <text x="12" y="52" fill="#F8FAFC" font-family="sans-serif" font-weight="600" font-size="12">Regional Renderer Engine</text>
    <text x="12" y="74" fill="#94A3B8" font-family="sans-serif" font-size="11">Dynamic terminology preservation</text>
    <text x="12" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">Court &amp; Act titles remain uncorrupted</text>
    <text x="12" y="120" fill="#38BDF8" font-family="monospace" font-size="10">Official Terms Intact</text>
  </g>
</svg>
